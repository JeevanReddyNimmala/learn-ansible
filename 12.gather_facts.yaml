- name: print facts
  hosts: local
  connection: local
  tasks:
  - name: print facts
    debug:
      msg: "{{ansible_facts}}"

  - name: print some information of facts
    debug:
      msg: |
        OS Family:{{ ansible_facts['os_family'] }}
        Private IP:{{ ansible_facts.default_ipv4.address }}
        Private IP:{{ ansible_facts['default_ipv4']['address'] }}

