- name: variables from prompts
  hosts: local
  connection: local
  vars_prompt:
  - name: username
    prompt: "Enter your username"
    private: false

  - name: password
    prompt: "Enter your password"
    private: true
  tasks:
  - name: print the variables from promt
    debug:
      msg: "The user name is {{username}} and the password is {{password}}"  
