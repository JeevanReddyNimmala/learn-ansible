- name: shell vs command module
  hosts: local
  connection: local
  tasks:
    - name: test the command module
      #command: cat /etc/user | grep ec2-user
      shell: cat /etc/passwd | grep ec2-user
      register: ec2_user_ouput
    - name: print the output
      debug:
        msg: "The output is {{ec2_user_ouput}}"

    - name: get the files
      shell: ls -l > /tmp/files.txt
      register: file_output

    - name: print the output
      debug:
        msg: "The output is {{file_output}}"
