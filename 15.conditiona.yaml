- name: print Os name
  hosts: local
  become: yes 
  connection: local
  tasks:
  - name: print OS name
    debug:
      msg: "The OS name is Redhat"
    when: ansible_facts[os_family] == "RedHat"  

  - name: print OS name
    debug:
      msg: "The OS name is Ubuntu"
    when: ansible_facts[os_family] == "Debian"    

  