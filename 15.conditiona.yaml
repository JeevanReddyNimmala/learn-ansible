- name: print Os name
  hosts: local
  become: true
  connection: local
  tasks:
  - name: print OS name
    debug:
      msg: "The OS name is Redhat"
    when: anisble_facts.os_family == "RedHat"  

  - name: print OS name
    debug:
      msg: "The OS name is Ubuntu"
    when: anisble_facts.os_family == "Debian"    


  - name: Install nginx  
    dnf:
      name: nginx
        state: present
    when: anisble_facts.os_family == "RedHat"

  - name: Install nginx  
    apt:
     name: nginx
     state: present
    when: anisble_facts.os_family == "Debian"   