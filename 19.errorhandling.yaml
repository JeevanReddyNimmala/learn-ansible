- name: error handling
  hosts: local
  connection: local
  become: yes
  tasks:
    - name: error handling demo
      command: id roboshop
      register: user_output
      ignore_errors: true 

    - name: pritn the data
      debug:
        msg: "The User id {{user_output}}"

    - name: create user
      command: useradd roboshop
      when: user_output.rc != 0

